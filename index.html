<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparely</title>
<style>
  :root { color-scheme: light dark; --fg: #1c1c1e; --muted: #6b6b70; --bg: #fbfbfd; --link: #0a62c4; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f2f7; --muted: #a1a1a8; --bg: #131316; --link: #6fb0ff; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { font-size: 2.25rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
  p.lede { font-size: 1.15rem; color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: .5rem 0; font-size: 1.1rem; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Sparely</h1>
  <p class="lede">A personal-finance ledger for iPhone and iPad. Your data stays on your device
  and in your own iCloud — no accounts, no analytics, no advertising.</p>
  <ul>
    <li><a href="privacy.html">Privacy policy</a></li>
    <li><a href="support.html">Support</a></li>
  </ul>
</main>
</body>
</html>
